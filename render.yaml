services:
  - type: web
    name: pyroscope-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /workspace/data/processed/current
      - key: REFERENCE_DIR
        value: /workspace/data/reference
      - key: LLM_PROVIDER
        value: replay
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: pyroscope-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    plan: free
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: pyroscope-api
          property: host
      - key: NEXT_PUBLIC_BASEMAP_STYLE_URL
        value: https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json

